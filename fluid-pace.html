<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluid Pace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a1628;
      --panel:       #0d1d34;
      --grid:        rgba(125,165,215,.13);
      --grid-strong: rgba(125,165,215,.24);
      --head:        #13243d;
      --label:       #8fb9ea;
      --text:        #e8f0fb;
      --muted:       #8298b6;
      --blue:        #1f6fd6;
      --blue-total:  #1e5fbf;
      --maroon:      #9a4a5e;
      --red:         #ff6b76;
      --green:       #54d495;
    }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { padding: 14px; max-width: 1400px; margin: 0 auto; }

    /* ── Header ── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: linear-gradient(90deg, #14315a, #0e2038);
      border: 1px solid var(--grid-strong);
      border-radius: 8px 8px 0 0;
      padding: 13px 18px;
    }
    .app-header .head-left { display: flex; align-items: baseline; gap: 14px; }
    .app-header h1 { font-size: 18px; font-weight: 700; letter-spacing: .3px; }
    .app-header .back {
      font-size: 11px; font-weight: 700; color: var(--label);
      text-decoration: none; white-space: nowrap;
    }
    .app-header .back:hover { color: var(--text); }
    .app-header .src {
      font-size: 11px; font-weight: 700; color: var(--label);
      text-align: right; line-height: 1.4;
    }

    /* ── Table ── */
    .table-scroll { overflow-x: auto; }
    .fp {
      width: 100%;
      min-width: 920px;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--panel);
      border: 1px solid var(--grid-strong);
      border-top: none;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
    }
    .fp th, .fp td {
      border-right: 1px solid var(--grid);
      border-bottom: 1px solid var(--grid);
      padding: 9px 12px;
    }
    .fp th:last-child, .fp td:last-child { border-right: none; }

    .fp thead th {
      background: var(--head);
      color: var(--label);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      border-bottom: 2px solid var(--grid-strong);
    }
    .fp thead th.l { text-align: left; }
    .fp thead th small {
      display: block;
      font-size: 8.5px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: .4px;
    }

    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ── Left merged cells ── */
    .c-period {
      text-align: center; font-weight: 800; font-size: 15px;
      color: #cfe2fb; background: rgba(31,111,214,.07);
    }
    .c-shiftgoal {
      text-align: center; font-weight: 800; font-size: 18px;
      color: #cfe2fb; background: rgba(31,111,214,.04);
    }
    .c-goalper  { text-align: center; font-weight: 700; font-size: 14px; }
    .c-planrate { text-align: center; color: var(--muted); font-weight: 600; }

    /* ── Time column ── */
    .c-time { color: #cdd9ea; white-space: nowrap; }
    .c-time.active { font-weight: 700; color: #fff; box-shadow: inset 3px 0 0 var(--blue); }
    .now-badge {
      display: inline-block;
      margin-left: 8px;
      background: rgba(31,111,214,.25);
      color: #7fd0ff;
      border: 1px solid rgba(127,208,255,.4);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .4px;
      vertical-align: middle;
    }

    /* ── Projected ── */
    .proj        { color: var(--muted); }
    .proj-finish { font-weight: 800; color: #fff; }

    /* ── Actual pill ── */
    .c-actual { text-align: center; }
    .pill {
      display: inline-block;
      min-width: 66px;
      text-align: center;
      border-radius: 14px;
      padding: 4px 12px;
      font-weight: 700;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      background: var(--blue);
      color: #fff;
      border: 1px solid rgba(255,255,255,.18);
    }
    .pill.ghost {
      background: rgba(31,111,214,.10);
      color: #6f9fd6;
      border: 1px dashed rgba(111,159,214,.5);
      font-weight: 600;
    }

    /* ── Difference ── */
    .neg { color: var(--red);   font-weight: 700; }
    .pos { color: var(--green); font-weight: 700; }

    /* ── Period total ── */
    .period-total td {
      font-weight: 800;
      border-top: 1px solid var(--grid-strong);
      border-bottom: 1px solid var(--grid-strong);
    }
    .period-total.behind td { background: var(--maroon); color: #ffe3e8; }
    .period-total.behind .neg { color: #ffd2d8; }
    .period-total.ahead  td { background: var(--blue-total); color: #eaf2ff; }
    .pt-label { text-align: center; }
    .pt-label small,
    .period-total .num small {
      display: block;
      font-size: 9.5px;
      font-weight: 600;
      opacity: .85;
      margin-top: 2px;
    }

    /* ── Grand total ── */
    .grand-total td {
      background: var(--blue-total);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      border-top: 2px solid #2b7fe0;
      border-bottom: none;
    }
    .grand-total .gt-label { letter-spacing: .5px; }
    .grand-total .neg { color: #ff8d96; }

    /* ── Footer ── */
    .foot {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      color: var(--muted);
      font-size: 10.5px;
      padding: 8px 4px 2px;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="app-header">
      <div class="head-left">
        <a class="back" href="index.html">&larr; OB Overview</a>
        <h1>Fluid Pace</h1>
      </div>
      <div class="src">
        Fluid Load Jobs from NEO<br />
        vs &nbsp;FL Actual from FL Utilization
      </div>
    </div>

    <div class="table-scroll">
      <table class="fp">
        <thead>
          <tr>
            <th>Period</th>
            <th class="l">Time</th>
            <th>Shift Goal</th>
            <th>Goal Per Period<small>NEO</small></th>
            <th>Plan Rate</th>
            <th>Planned</th>
            <th>Projected</th>
            <th>Actual</th>
            <th>Difference</th>
          </tr>
        </thead>
        <tbody id="fp-body"></tbody>
      </table>
    </div>

    <div class="foot"><span id="ts"></span></div>
  </div>

  <script>
  "use strict";

  // ── Shift data (Fluid Load NEO plan vs FL Utilization actual) ──────────────
  const SHIFT_GOAL = 68400;

  const PERIODS = [
    {
      id: "P1",
      goalPerPeriod: 28800,
      planRate: "7,200/hr",
      actRate:  "6,398/hr",
      rows: [
        { time: "19:00 - 20:00", planned: 7200, actual: 6395, status: "complete" },
        { time: "20:00 - 21:00", planned: 7200, actual: 6395, status: "complete" },
        { time: "21:00 - 22:00", planned: 6595, actual: 5858, status: "active",
          active: true, activeLabel: "NOW · 8.9H ACTIVE" },
        { time: "22:00 - 23:00", planned: null, projected: 6216, actual: null, status: "future" },
      ],
    },
    {
      id: "P2",
      goalPerPeriod: 21600,
      planRate: "7,200/hr",
      rows: [
        { time: "23:30 - 00:30", projected: 6216, actual: null, status: "future" },
        { time: "00:30 - 01:30", projected: 6216, actual: null, status: "future" },
        { time: "01:30 - 02:30", projected: 6216, actual: null, status: "future" },
      ],
    },
    {
      id: "P3",
      goalPerPeriod: 18000,
      planRate: "7,200/hr",
      rows: [
        { time: "03:00 - 04:00", projected: 6216, actual: null, status: "future" },
        { time: "04:00 - 05:00", projected: 6216, actual: null, status: "future" },
        { time: "05:00 - 05:30", projected: 3108, actual: null, status: "future" },
      ],
    },
  ];

  // ── Formatting helpers ─────────────────────────────────────────────────────
  const NF = new Intl.NumberFormat("en-US");
  const fmt = v => (v === null || v === undefined || v === "") ? "" : NF.format(v);
  const fmtSigned = v => (v === null || v === undefined) ? ""
    : (v < 0 ? "-" : "+") + NF.format(Math.abs(v));
  const diffClass = v => v == null ? "" : (v < 0 ? "neg" : v > 0 ? "pos" : "");

  // ── Render ─────────────────────────────────────────────────────────────────
  function render() {
    const bodyRowCount = PERIODS.reduce((s, p) => s + p.rows.length + 1, 0); // for Shift Goal span
    let firstShiftCell = true;
    let html = "";

    // Grand-total accumulators
    let gPlanned = 0, gProjected = 0, gActual = 0, gGoalPer = 0;

    for (const p of PERIODS) {
      const span = p.rows.length + 1; // data rows + period-total row

      // Period aggregates
      const plannedTotal = p.rows.reduce((s, r) => s + (r.planned || 0), 0);
      const actualTotal  = p.rows.reduce((s, r) => s + (r.actual  || 0), 0);
      const hasActual    = p.rows.some(r => r.actual != null);
      const futureProj   = p.rows
        .filter(r => r.status === "future")
        .reduce((s, r) => s + (r.projected || 0), 0);
      const projectedTotal = actualTotal + futureProj;          // achieved + remaining projection
      const diffTotal      = hasActual ? actualTotal - plannedTotal : null;

      gPlanned   += plannedTotal;
      gProjected += projectedTotal;
      gActual    += actualTotal;
      gGoalPer   += p.goalPerPeriod;

      // Data rows
      p.rows.forEach((r, i) => {
        html += "<tr>";

        if (i === 0) html += `<td rowspan="${span}" class="c-period">${p.id}</td>`;

        html += `<td class="c-time${r.active ? " active" : ""}">${r.time}` +
                `${r.active ? `<span class="now-badge">${r.activeLabel}</span>` : ""}</td>`;

        if (firstShiftCell) {
          html += `<td rowspan="${bodyRowCount}" class="c-shiftgoal">${fmt(SHIFT_GOAL)}</td>`;
          firstShiftCell = false;
        }

        if (i === 0) {
          html += `<td rowspan="${span}" class="c-goalper">${fmt(p.goalPerPeriod)}</td>`;
          html += `<td rowspan="${span}" class="c-planrate">${p.planRate}</td>`;
        }

        // Planned
        html += `<td class="num">${fmt(r.planned)}</td>`;

        // Projected — active row shows the period finish projection; future rows show the hourly projection
        let proj = "";
        if (r.active)                  proj = `<span class="proj-finish">${fmt(projectedTotal)}</span>`;
        else if (r.status === "future") proj = `<span class="proj">${fmt(r.projected)}</span>`;
        html += `<td class="num">${proj}</td>`;

        // Actual
        html += `<td class="c-actual">` +
          (r.actual != null
            ? `<span class="pill">${fmt(r.actual)}</span>`
            : `<span class="pill ghost">Fluid actual</span>`) +
          `</td>`;

        // Difference (per row)
        const d = (r.actual != null && r.planned != null) ? r.actual - r.planned : null;
        html += `<td class="num ${diffClass(d)}">${fmtSigned(d)}</td>`;

        html += "</tr>";
      });

      // Period-total row
      const ptCls = (hasActual && diffTotal < 0) ? "behind" : "ahead";
      html += `<tr class="period-total ${ptCls}">` +
        `<td class="pt-label">Period total<small>Req ${p.planRate}</small></td>` +
        `<td class="num">${fmt(plannedTotal)}</td>` +
        `<td class="num">${fmt(projectedTotal)}</td>` +
        `<td class="num">${hasActual ? fmt(actualTotal) : "&ndash;"}` +
          `${hasActual && p.actRate ? `<small>Act ${p.actRate}</small>` : ""}</td>` +
        `<td class="num ${diffClass(diffTotal)}">${diffTotal != null ? fmtSigned(diffTotal) : "&ndash;"}</td>` +
        `</tr>`;
    }

    // Grand-total row
    const gDiff = gActual - gPlanned;
    html += `<tr class="grand-total">` +
      `<td colspan="2" class="gt-label">Total So Far</td>` +
      `<td>${fmt(SHIFT_GOAL)}</td>` +
      `<td>${fmt(gGoalPer)}</td>` +
      `<td>7,200/hr</td>` +
      `<td>${fmt(gPlanned)}</td>` +
      `<td>${fmt(gProjected)}</td>` +
      `<td>${fmt(gActual)}</td>` +
      `<td class="${diffClass(gDiff)}">${fmtSigned(gDiff)}</td>` +
      `</tr>`;

    document.getElementById("fp-body").innerHTML = html;
    document.getElementById("ts").textContent =
      "Last refreshed " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  render();
  </script>
</body>
</html>
